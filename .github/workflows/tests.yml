# The unit tests, on Windows (where TES3X is used) and Linux (where the server image runs).
# They need no game files or emulator; see docs/testing.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Qt's offscreen platform, for the GUI tests, still loads these
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e .[gui,dev]
      - run: python tools/lint.py
      - run: python -m unittest discover -s tests -v
      # The wheel alone, installed in a fresh venv and run from outside the checkout
      - shell: bash
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheel"
          py="$RUNNER_TEMP/wheel/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/wheel/Scripts/python.exe"
          "$py" -m pip install "$RUNNER_TEMP"/dist/tes3x-*.whl
          cd "$RUNNER_TEMP" && "$py" - < "$GITHUB_WORKSPACE/tests/installed_check.py"
