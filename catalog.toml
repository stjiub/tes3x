[[mod]]
id = "tamriel-data"
name = "Tamriel Data"
version = "26.08"
url = "https://www.tamriel-rebuilt.org/downloads/resources"
folder = "Tamriel Data"
status = "untested"
notes = "Needed by Tamriel Rebuilt; see that entry."

[[mod]]
id = "tamriel-rebuilt"
name = "Tamriel Rebuilt"
version = "26.08.23"
url = "https://www.tamriel-rebuilt.org/downloads/main-release"
folder = "TR"
status = "untested"
patches = ["dxt5-size", "heap-region", "video-arena"]
ram = 128
bios = "cerbios"
dependencies = ["tamriel-data"]
notes = """Its records alone need more than 64 MB. With 128 MB its plugins load and play; with \
its assets too, the textures around Firewatch overflow the video memory."""
