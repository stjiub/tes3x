[[mod]]
id = "jammings-off"
name = "Jammings Off"
version = "unknown"
url = "https://www.nexusmods.com/morrowind/mods/44523"
folder = "JammingsOff"
status = "works"

[[mod]]
id = "purists"
name = "Patch for Purists"
version = "4.0.2"
url = "https://www.nexusmods.com/morrowind/mods/45096"
folder = "Purists"
