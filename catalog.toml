[[mod]]
id = "purists"
name = "Patch for Purists"
version = "4.0.2"
url = "https://www.nexusmods.com/morrowind/mods/45096"
folder = "Purists"
status = "passes-automated"
patches = ["dialogue-merge", "mcp-114", "mcp-119"]
splice_kf = [
    { source = "meshes/xbase_anim.kf", groups = ["idle", "idle2", "idle3", "idle4", "idle5", "idle6", "idle7", "idle8", "idle9", "idlestorm"] },
    { source = "meshes/xbase_anim_female.kf", groups = ["idle4", "idle5"] },
]
notes = "The Xbox loader drops stock responses when this mod repeats a dialogue topic; dialogue-merge keeps them. Separate axe inventory sounds and creature voiceovers need the two MCP compatibility patches. Its xbase_anim.kf and xbase_anim_female.kf freeze New Game because their root rotation is XYZ Euler, which hangs the Xbox loader, and they replace retail's Xbox-specific animations. The pipeline replaces them with retail's KFs plus the mod's idle-clip root translation, which is its only animation fix."

