# Mods tried on the Xbox build, and how they fared.
#
# The GUI's mod list and docs/catalog.md are generated from this file: run
# `tes3x patches --write` after editing it.
#
# id            stable name for the mod
# name, url     what it is called and where it comes from
# version       the version tried
# folder        its usual folder or plugin name, which is how the GUI recognises it
# status        untested, passes-automated, works, works-with-requirements,
#               works-partially (loads, but part of the mod is left out: see exclude), broken,
#               or not-possible; only a person sets works or works-partially, after playing
# patches       TES3X patches it needs
# ram           64 or 128; 128 means it needs an upgraded Xbox
# bios          a BIOS it needs, such as "cerbios"
# requirements  anything else it needs, in words
# dependencies  ids of other mods here it needs
# plugins       the plugins to use, when not all of them
# memory_kb     most free memory the mod costs against vanilla on `tes3x test --tour`, in KB
# merge_kf      animation KFs, by name in the collected build, that the pipeline appends to
#               xbase_anim.kf
# splice_kf     tables {source, groups, bones, channels}: the pipeline replaces the mod's KF at
#               source with retail's plus the mod's tracks for those animation groups
#               (bones default to ["bip01"], channels to ["translation"])
# exclude       file patterns the pipeline leaves out of this mod, relative to its data folder
# notes         what was tried and what happened
# updated       date of the last change to this file (YYYY-MM-DD); bump it with every edit. The
#               GUI downloads this file from GitHub and keeps whichever copy is newer.
schema = 1
updated = "2026-10-29"

[[mod]]
