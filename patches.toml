# Every XBE patch TES3X can apply, in the order it applies them.
#
# tes3x_patch.py, the pipeline and the diagnostics log reader all read this file, so a patch's
# name, bit, category and status are set here and nowhere else. docs/patches.md is generated
# from it: run `python tools/tes3x_patches.py --write` after editing.
#
# name       what --apply and profiles call it
# bit        its bit in the patch mask the payload logs (diag.patches); fixed forever once used
# category   core, correctness, compat, performance, qol, balance, instrumentation, infrastructure
# status     implemented, verified-xemu or verified-hardware
# selection  how a build gets it:
#              always    - every pipeline build
#              packaging - chosen by the package mode
#              preset    - by preset, or by name in a profile's enable/disable
#              option    - by a command-line option or research use only
# source     payload C file the patch needs, if any
# takes      the value it needs, as NAME=VALUE
# summary    one line, shown by --list and in docs/patches.md
# evidence   proof records under patches/<name>/ (tools/tes3x_proof.py); "findings: ..." marks
#            older evidence not yet converted to a record
# origin     the project a fix comes from, when not TES3X: { source = "MCP", id = "97" }
#
# Fixes that are not implemented, including every MCP id, are in candidates.toml.

[source.MCP]
name = "Morrowind Code Patch"
url = "https://www.nexusmods.com/morrowind/mods/19510"

[source.MWSE]
name = "MWSE engine patches"
url = "https://mwse.github.io/MWSE/references/general/patches/"

[source.OpenMW]
name = "OpenMW"
url = "https://openmw.org"

[source.OpenMW-4642]
name = "OpenMW live inventory refresh"
url = "https://gitlab.com/OpenMW/openmw/-/merge_requests/4642"

[source.SIGF]
name = "Skill Increase GMST Fix"
url = "https://www.nexusmods.com/morrowind/mods/48029"

[source."MGE XE"]
name = "MGE XE"
url = "https://www.nexusmods.com/morrowind/mods/41102"

[source.TES3X]
name = "TES3X"

[[patch]]
name = "payload"
category = "infrastructure"
status = "verified-xemu"
selection = "option"
takes = "FILE.pe"
summary = "Inject a code section and run it from the entry point."
evidence = ["findings: every hooked xemu run"]

[[patch]]
name = "boot-media"
bit = 2
category = "infrastructure"
status = "verified-xemu"
selection = "always"
summary = "Permit booting from any media and region, not just a retail DVD."
evidence = ["findings: every xemu run"]

[[patch]]
name = "drive-letters"
bit = 0
category = "infrastructure"
status = "verified-xemu"
selection = "always"
takes = "LETTER"
summary = "Point every Data Files asset path at one drive."
evidence = ["findings: every xemu run"]

[[patch]]
