# Every XBE patch TES3X can apply, in the order it applies them.
#
# tes3x_patch.py, the pipeline and the diagnostics log reader all read this file, so a patch's
# name, bit, category and channel are set here and nowhere else. docs/patches.md is generated
# from it: run `python tools/tes3x_patches.py --write` after editing.
#
# name       what --apply and profiles call it
# bit        its bit in the patch mask the payload logs (diag.patches); fixed forever once used
# category   core, correctness, compat, performance, qol, balance, instrumentation, infrastructure
# channel    development or release; promotion to release is a maintainer decision
# selection  how a build gets it:
#              always    - every pipeline build
#              packaging - chosen by the package mode
#              preset    - by preset, or by name in a profile's enable/disable
#              option    - by a command-line option or research use only
# source     payload C file the patch needs, if any
# takes      the value it needs, as NAME=VALUE
# ini        [Xbox] keys it reads from Morrowind.ini, each with the engine's default ("" when the
#            default follows another key); docs/ini-keys.md explains them
# summary    one line, shown by --list and in docs/patches.md
# validation validation results under patches/<name>/ (tools/tes3x_validate.py); "findings: ..."
#            marks older observations not yet converted to a result
# origin     the project a fix comes from, when not TES3X: { source = "MCP", id = "97" }
#
# Fixes that are not implemented, including every MCP id, are in candidates.toml.

[source.MCP]
name = "Morrowind Code Patch"
url = "https://www.nexusmods.com/morrowind/mods/19510"

[source.MWSE]
name = "MWSE engine patches"
url = "https://mwse.github.io/MWSE/references/general/patches/"

[source.OpenMW]
name = "OpenMW"
url = "https://openmw.org"

[source.OpenMW-4642]
name = "OpenMW live inventory refresh"
url = "https://gitlab.com/OpenMW/openmw/-/merge_requests/4642"

[source.SIGF]
name = "Skill Increase GMST Fix"
url = "https://www.nexusmods.com/morrowind/mods/48029"

[source."MGE XE"]
name = "MGE XE"
url = "https://www.nexusmods.com/morrowind/mods/41102"

[source.TES3X]
name = "TES3X"

[[patch]]
name = "payload"
category = "infrastructure"
channel = "development"
selection = "option"
takes = "FILE.pe"
summary = "Inject a code section and run it from the entry point."

[[patch]]
name = "boot-media"
bit = 2
category = "infrastructure"
channel = "development"
selection = "always"
summary = "Permit booting from any media and region, not just a retail DVD."

[[patch]]
name = "drive-letters"
bit = 0
category = "infrastructure"
channel = "development"
selection = "always"
takes = "LETTER"
summary = "Point every Data Files asset path at one drive."

[[patch]]
name = "save-staging"
bit = 1
category = "infrastructure"
channel = "development"
selection = "option"
takes = "LETTER"
summary = "Stage saves on one volume with UDATA so the commit renames instead of copying."

[[patch]]
name = "title"
category = "infrastructure"
channel = "development"
selection = "option"
takes = "NAME"
summary = "Rename the XBE's certificate title, the name a dashboard falls back to."

[[patch]]
name = "multi-bsa"
bit = 3
category = "infrastructure"
channel = "development"
selection = "packaging"
source = "tes3xarch.c"
summary = "Load every archive listed in tes3xarch.txt, not just Morrowind.bsa."

[[patch]]
name = "script-ext"
bit = 4
category = "compat"
channel = "development"
selection = "preset"
source = "tes3xscript.c"
summary = "Add script opcodes: widen the length bounds and hook Script::RunFunction."

[[patch]]
name = "mwse-legacy"
bit = 18
category = "compat"
channel = "development"
selection = "preset"
source = "tes3xmwse.c"
summary = "Interpret legacy MWSE 0.9.4 bytecode embedded in compiled scripts."

[[patch]]
name = "mcp-1"
origin = { source = "MCP", id = "1" }
bit = 5
category = "core"
channel = "development"
selection = "preset"
source = "tes3xrefs.c"
ini = { DropReplacedRefs = "1" }
summary = "Stop an unresolvable reference being restamped as created at runtime."

[[patch]]
name = "mcp-97"
origin = { source = "MCP", id = "97" }
bit = 9
category = "core"
channel = "development"
selection = "preset"
source = "tes3xmcp97.c"
summary = "Advance the script parser correctly while initializing saved data."

[[patch]]
name = "mcp-154"
origin = { source = "MCP", id = "154" }
bit = 10
category = "core"
channel = "development"
selection = "preset"
source = "tes3xmcp154.c"
summary = "Pad compiled script-data allocations to keep dword reads in bounds."

[[patch]]
name = "mcp-102"
origin = { source = "MCP", id = "102" }
bit = 12
category = "correctness"
channel = "development"
selection = "preset"
summary = "Reactivate script-triggered objects after their script mod is removed."

[[patch]]
name = "dxt5-size"
bit = 14
category = "core"
channel = "development"
selection = "preset"
source = "tes3xdxt5.c"
summary = "Allocate DXT5 textures at their real size, not a negative one that corrupts video memory."

[[patch]]
name = "video-arena"
bit = 17
category = "compat"
channel = "development"
selection = "preset"
source = "tes3xarena.c"
ini = { VideoMemoryKB = "22528" }
summary = "With more than 64 MB, size the texture and vertex buffer arena from [Xbox] VideoMemoryKB."

[[patch]]
name = "rotating-autosaves"
origin = { source = "OpenMW" }
bit = 8
category = "qol"
channel = "development"
selection = "preset"
source = "tes3xsaves.c"
ini = { RotatingAutosaves = "1", AutosaveSlots = "3" }
summary = "Rotate automatic saves through INI-configurable slots."

[[patch]]
name = "build-preferences"
bit = 15
category = "qol"
channel = "development"
selection = "option"
source = "tes3xprefs.c"
summary = "Apply profile-selected player preferences after stored Xbox options load."

[[patch]]
name = "transition-autosaves"
bit = 16
category = "qol"
channel = "development"
selection = "preset"
source = "tes3xsaves.c"
ini = { TransitionAutosaves = "1" }
summary = "Autosave before doors, scripted teleports, interventions and paid travel."

[[patch]]
name = "diagnostics"
bit = 6
category = "instrumentation"
channel = "development"
selection = "preset"
source = "tes3xdiag.c"
ini = { Diagnostics = "0", DiagnosticsLevel = "", HangWatchdog = "1", HangTimeoutSeconds = "60" }
summary = "Enable INI-controlled crash records, snapshots and a hang watchdog."

[[patch]]
name = "console"
bit = 7
category = "qol"
channel = "development"
selection = "preset"
source = "tes3xconsole.c"
ini = { ConsoleCombo = "7,9" }
summary = "Make the in-game console reachable, by replacing its input gate."

[[patch]]
name = "profile"
bit = 13
category = "instrumentation"
channel = "development"
selection = "option"
source = "tes3xprof.c"
takes = "VA[,VA...]"
ini = { ProfileDumpFrames = "0", ProfileDumpSeconds = "30" }
summary = "Time listed functions with RDTSC at every direct call site."

[[patch]]
name = "heap-census"
bit = 19
category = "instrumentation"
channel = "development"
selection = "option"
source = "tes3xheap.c"
summary = "Count live engine heap bytes by source file and line, or by call site."

[[patch]]
name = "mem-census"
bit = 21
category = "instrumentation"
channel = "development"
selection = "option"
source = "tes3xmem.c"
summary = "Count kernel allocations and the XAPI heap by caller, with the address space map."

[[patch]]
name = "heap-region"
bit = 20
category = "compat"
channel = "development"
selection = "preset"
source = "tes3xregion.c"
ini = { HeapRegionKB = "98304" }
summary = "With more than 64 MB, size the engine heap's region from [Xbox] HeapRegionKB."

[[patch]]
name = "info-name-arena"
bit = 22
category = "compat"
channel = "development"
selection = "preset"
source = "tes3xinfoarena.c"
summary = "Page INFO's temporary ID, previous and next names outside the engine heap."

[[patch]]
name = "lean-menu"
bit = 23
category = "performance"
channel = "development"
selection = "preset"
source = "tes3xleanmenu.c"
summary = "Load only game settings for the main menu; New Game and Load relaunch and load the rest."

[[patch]]
name = "mcp-146"
origin = { source = "MCP", id = "146" }
bit = 24
category = "qol"
channel = "development"
selection = "preset"
source = "tes3xmcp146.c"
summary = "Remove a fully nocked arrow with the Ready Weapon control."

[[patch]]
name = "bow-view"
bit = 25
category = "qol"
channel = "development"
selection = "preset"
source = "tes3xbowview.c"
ini = { BowViewOffsetZ = "-12" }
summary = "Lower the first-person bow and arms while an arrow is nocked."
