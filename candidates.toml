# Fixes TES3X has reviewed but not implemented, and why.
#
# Every Morrowind Code Patch id has an entry, plus fixes from MWSE, OpenMW and TES3X's own
# measurements. docs/candidates.md is generated from this file with the patch table: run
# `python tools/tes3x_patches.py --write` after editing. When a fix is implemented, delete its
# entry here and add a [[patch]] entry to patches.toml under the same name.
#
# status     researching, located, candidate, deferred, not-applicable (PC-only), infeasible
#            (tried, cannot be done) or rejected
# priority   high, medium, low, or none for fixes that will not be ported
# category   the TES3X category it would have (see patches.toml); omitted when not applicable
# default    notes on its default policy, when not the category's usual one
# origin     the project it comes from; sources are listed in patches.toml
# reason     why it has this status, in a sentence or two
# doc        a page with the longer reasoning, when needed

