kind = "single"
purpose = "A scripted interior-to-exterior cell transition completes normally and produces a successful autosave when transition-autosaves is enabled."
procedure = "Boot a minimal direct-engine build, start a new game, teleport to Balmora, and inspect the transition and save events before exiting."
limitations = "Original-Xbox save latency, travel and intervention call sites, or long-session rotation behavior."
watch = 'diag\.patches|console< GetPos|autosave\.transition'
enable = ["diagnostics", "console", "rotating-autosaves"]
timeout = 180
script = '''
@menu click MenuOptions MenuOptions_New_container
wait 30
coc "Balmora"
wait 180
player->getpos x
exit
'''

[expect]
test = ['autosave\.transition 1', 'autosave\.transition_ok 1', 'console< GetPos >> -12288\.00']
