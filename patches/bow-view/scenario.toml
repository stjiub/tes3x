kind = "single"
purpose = "A build carrying the conditional first-person transform hook reaches a playable session without a crash."
procedure = "Boot a direct-engine build with bow-view, start a new game, wait in game, then exit through the command script. Separately compare the views and aim described in the patch notes on a 480p display."
limitations = "The script cannot draw a bow or capture a controlled view, so obstruction, aim, unaffected view types, crossbows, and offset tuning require manual testing."
watch = 'diag\.patches|exec\.exit|crash\.|hang\.detected|fatal\.'
timeout = 180
script = '''
@start new
wait 60
exit
'''

[expect]
test = ['diag\.patches', 'exec\.exit 0']
