claim = "The patched build runs the commands in tes3xexec.txt through the console's own compiler and logs their output: after coc the player's position is Balmora's. The control build never reads the file."
method = "New Game from the engine's main menu, then player->getpos x, coc \"Balmora\", player->getpos x and exit, from E:\\tes3xexec.txt on both builds."
not_established = "Opening the console with the pad combination and typing on the on-screen keyboard; hardware behaviour."
watch = 'exec[.>]|console< GetPos|console\.more|diag\.enabled'
timeout = 120
script = '''
@menu click MenuOptions MenuOptions_New_container
wait 30
player->getpos x
coc "Balmora"
wait 60
player->getpos x
exit
'''

[expect]
control = ['diag\.enabled', '!exec\.loaded', '!console<']
patched = ['exec\.loaded ', 'console< GetPos >> 61\.00', 'console< GetPos >> -12288\.00', 'exec\.exit']
