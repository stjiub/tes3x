claim = "A profile-selected normal-look preference is applied after stored controls load, swapping the right-stick vertical bindings before a clean menu exit."
method = "Boot identical direct-engine builds from the same invert_look=false profile; disable build-preferences only in the control and compare the binding-table log."
not_established = "Custom non-stick bindings, persistence after the game writes options, or original-Xbox behavior."
watch = 'diag\.patches|prefs\.|exec\.exit'
timeout = 180
script = '''
@menu wait 60
@menu exit
'''

[expect]
control = ['exec\.exit 0', '!prefs\.invert_look']
patched = ['prefs\.invert_look 0', 'prefs\.look_up 26', 'prefs\.look_down 25', 'exec\.exit 0']
