# Places the memory tour visits, and the groups the GUI's checklist shows them under.
#
# id      stable name; also the label the tour marks in the log
# group   heading in the checklist
# name    shown in the checklist
# cell    interior or named cell, used as `coc "cell"`
# grid    exterior cell, used as `coe x, y`
# refs    references in the vanilla cell, as a rough guide to how heavy it is
# tour    preset names that include it: cities, dense, expansions
#
# Exactly one of cell and grid. `tes3x tour` checks the cells exist in Morrowind.esm.
schema = 1

