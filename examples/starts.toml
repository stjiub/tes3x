# Where a new multiplayer character may begin: `tes3x net serve --starts FILE`. Without
# --starts the server offers this list. With one entry there is no choice.
#
# name      the button the player picks, at most 31 characters, no double quotes
# cell      an interior cell; without it the position is in the exterior world
# position  x, y, z
# rotation  the facing PositionCell and Position take
# remove    [[id, count], ...] taken from the starting clothes
# items     [[id, count], ...] given
# equip     [id, ...] equipped after the items are given
# script    further lines run on the console, after the rest
#
# Places after Chargen Revamped (Nexus 44110), whose Xbox conversion is XboxChargenRevamped.

