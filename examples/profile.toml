# Copy this file into profiles/ and edit it for one build. Commented lines show each option
# with its default; uncomment one to change it. docs/configuration.md describes them all.

[profile]
name = "my-build"                    # output: BUILD_ROOT/my-build
# library = "/path/to/mod-library"  # override paths.mod_library in the local config
# title = "Morrowind Modded"         # dashboard title; default: the retail title
# dashboards = ["xbmc4gamers"]       # dashboard metadata written when title is set; [] for none
# install_dir = "MorrowindModded"   # folder below each Xbox target's games_root; default: name
# install_layout = "full"            # "overlay" keeps only files that differ from retail

[rules]
max_texture_size = 512               # shrink mod textures larger than this
clear_cache_partitions = true        # clear the Xbox's X/Y/Z cache after deploying
# convert_all_textures = false       # convert every mod texture, not only oversized ones
# max_filename = 42                  # longest file name allowed; FATX's limit is 42
# plugin_order = "mods"              # "mods": masters first, then mod order
#                                    # "mlox": sort with mlox; needs paths.mlox_rules
# keep_assets = []                   # patterns reachability pruning must keep
# exclude = [...]                    # patterns left out of mod folders; replaces the built-in list

[patches]
# minimal: no optional patches
# recommended: release fixes selected for general use
# testing: recommended, preview fixes, diagnostics and the console
preset = "recommended"

# Uncomment a line to add that patch. docs/patches.md describes each one.
enable = [
    # "ref-index",             # performance: index references while global scripts start
    # "mcp-1",                 # core: stop an unresolvable reference being restamped as created at runtime
    # "mcp-3",                 # correctness: apply Unarmored reduction with no armor equipped
    # "mcp-25",                # correctness: make Blind lower the player's attack chance
    # "dialogue-merge",        # correctness: keep a topic's responses when a plugin adds to it
    # "mcp-37",                # core: cancel stale NPC casts before a cell change leaves them dangling
    # "mcp-97",                # core: advance the script parser correctly while initializing saved data
    # "mcp-98",                # core: keep animated-container access from destroying a live animation
    # "mcp-92",                # core: retire a summoned actor's magic before destroying it
    # "mcp-154",               # core: pad compiled script-data allocations to keep reads in bounds
    # "mcp-123",               # core: persist objects placed by scripts into unvisited cells
    # "mcp-160",              # correctness: take weight off an actor only for items actually removed
    # "mwse-enable-disable-vars", # core: no crash when Enable or Disable runs in a script without locals
    # "mcp-173",               # core: persist NPC faction rank changes made by scripts
    # "mcp-6",                 # correctness: let Restore and expiring Drain recover the active Fortify amount
    # "mwse-pathgrid-zero",    # core: no crash when Wander or Flee meets a node-less pathgrid
    # "mcp-125",               # core: initialize scripts and collision for actors moved by Position
    # "mcp-127",               # compat: keep replacement land textures from resizing the world map
    # "mcp-132",               # compat: play scripted humanoid animations on all body layers
    # "cant-touch-this",       # compat: dodge animations on missed melee attacks (needs the mod)
    # "dxt5-size",             # core: allocate DXT5 textures at their real size
    # "mcp-102",               # correctness: reactivate script-triggered objects after their mod is removed
    # "mcp-94",                # correctness: scale books, the journal and scrolls by screen height
    # "mcp-47",                # correctness: keep NPC magic-item changes from deselecting the player's spell
    # "mcp-48",                # correctness: show earned level-up multipliers through 100
    # "mcp-30",                # correctness: align bow projectiles for scaled races and third person
    # "mcp-55",                # correctness: keep potion names and refresh inventory icons after alchemy
    # "mcp-118",               # correctness: keep airborne item drops near the player
    # "script-ext",            # compat: add script opcodes
    # "mwse-legacy",           # compat: run legacy MWSE 0.9.4 script bytecode
    # "video-arena",           # compat: more video memory on a 128 MB Xbox
    # "heap-region",           # compat: larger engine heap on a 128 MB Xbox
    # "info-name-arena",       # compat: move dialogue names out of the engine heap
    # "lean-menu",             # performance: load only game settings for the main menu
    # "loop-sleeps",           # performance: save and load without forced 1 ms sleeps
    # "dialogue-owner",        # performance: find a response's topic without searching every topic
    # "lazy-dialogue",         # compat: build topic responses on first use instead of at load
    # "pool-grow",             # compat: grow small-block pools instead of spilling into the heap
    # "link-name-arena",       # compat: move NPC and inventory link names out of the engine heap
    # "mcp-146",                # qol: remove a fully nocked arrow with Ready Weapon
    # "mcp-149",                # core: wait for death processing before offering corpse disposal
    # "bow-view",               # qol: lower the first-person bow and arms while an arrow is nocked
    # "hd-video",              # qol: 720p when the dashboard enables it, else 480p/480i (128 MB advised)
    # "ui-scale",              # qol: smaller text and HUD art; configure in [ui]
    # "extended-tooltips",     # qol: ownership warnings and extra item details
    # "topic-colors",          # qol: dim dialogue topics whose response you have read
    # "boot-clear",            # qol: clear the screen before the first frame, no green flicker without the launcher
    # "menu-still",            # qol: a still behind the main menu instead of the logo movie (needs ffmpeg)
    # "dash-button",           # qol: a TES3X button in the main and pause menus that leaves for the Dash
    # "rotating-autosaves",    # qol: rotate autosaves through several slots
    # "transition-autosaves",  # qol: autosave before doors, teleports and travel
    # "console",               # qol: in-game console (already in testing)
    # "diagnostics",           # instrumentation: crash records and a hang watchdog
    # "data-overlay",          # infrastructure: read missing files from [Xbox] OverlayBase
    # "net",                   # infrastructure: shared Xbox NIC, IPv4 and UDP foundation
    # "multiplayer",           # infrastructure: join a TES3X server set by [Xbox] NetAddress
    # "agent",                # infrastructure: report live status and logs to the TES3X GUI
]

# Patches the preset includes that you don't want, such as "console".
disable = []

# Add every patch in these categories: core, correctness, compat, performance, qol, balance,
# instrumentation.
# categories = []

[preferences]
# Applied after the Xbox's stored controls load. Omit the table to leave player preferences alone.
invert_look = false

# [ui]
# scale = 0.8                    # one factor for fonts and HUD art; selects ui-scale
# widescreen_480p = true         # correct HUD art when 640x480 is stretched to 16:9

[package]
# How mod files are shipped:
#   "delta-bsa":  mod files in their own archive beside the retail one. Uses a prebuilt payload
#                 for supported patch sets; other combinations need LLVM.
#   "merged-bsa": mod files merged into a rebuilt Morrowind.bsa.
#   "loose":      every mod file loose in Data Files. No LLVM or archive needed and easy to
#                 inspect, but the Xbox searches large folders for every file.
mode = "delta-bsa"
# archive_name = "tes3xmods.bsa"     # the mod archive's name in delta-bsa mode
# archive_only = false               # read assets only from archives, never loose files
# loose_assets = []                  # patterns kept loose in an archive build, e.g. "textures/sky/*"
# drive_letter = "D"                 # drive the game reads its files from

# [plugins]
# order = ["Mod.esm", "Mod.esp"]     # load order; default: masters first, then mod order

[ini]
# "General:Show FPS" = 1
# "Xbox:AutosaveSlots" = 5           # docs/ini-keys.md lists the keys patches read

# Remove every [[mods]] block and profile.library for a patches-only build.
[[mods]]
id = "example-mod"                  # stable id from library.toml
version = "1.0"
components = ["extra-textures"]     # optional installer layers
order = 10                           # higher order wins file conflicts
# enabled = false
# optional = true                    # skip the mod if its folder is missing
# plugins = ["Example Mod.esp"]      # include only these plugins from this mod
# loose = true                       # ship this mod's files loose in an archive build
