# Copy this file into profiles/ and edit it for one build. Commented lines show each option
# with its default; uncomment one to change it. docs/configuration.md describes them all.

[profile]
name = "my-build"                    # output: build/pipeline/my-build
library = "C:/path/to/mod-library"  # remove for a patches-only build
# title = "Morrowind Modded"         # dashboard title; default: the retail title
# dashboards = ["xbmc4gamers"]       # dashboard metadata written when title is set; [] for none
# remote_root = "F:/Games/MorrowindModded"   # Xbox game folder; default: the local config's

[rules]
max_texture_size = 512               # shrink mod textures larger than this
clear_cache_partitions = true        # clear the Xbox's X/Y/Z cache after deploying
# convert_all_textures = false       # convert every mod texture, not only oversized ones
# max_filename = 42                  # longest file name allowed; FATX's limit is 42
# plugin_order = "mods"              # "mods": masters first, then mod order
#                                    # "mlox": sort with mlox; needs paths.mlox_rules
# keep_assets = []                   # patterns reachability pruning must keep
# exclude = [...]                    # patterns left out of mod folders; replaces the built-in list

[patches]
# minimal: no optional patches
# standard: tested fixes and the in-game console
# development: standard, untested fixes and diagnostics
preset = "standard"

# Uncomment a line to add that patch. docs/patches.md describes each one.
enable = [
    # "mcp-1",                 # core: stop an unresolvable reference being restamped as created at runtime
    # "mcp-97",                # core: advance the script parser correctly while initializing saved data
    # "mcp-154",               # core: pad compiled script-data allocations to keep reads in bounds
    # "dxt5-size",             # core: allocate DXT5 textures at their real size
    # "mcp-102",               # correctness: reactivate script-triggered objects after their mod is removed
    # "script-ext",            # compat: add script opcodes
    # "mwse-legacy",           # compat: run legacy MWSE 0.9.4 script bytecode
    # "video-arena",           # compat: more video memory on a 128 MB Xbox
    # "heap-region",           # compat: larger engine heap on a 128 MB Xbox
    # "info-name-arena",       # compat: move dialogue names out of the engine heap
    # "lean-menu",             # performance: load only game settings for the main menu
    # "rotating-autosaves",    # qol: rotate autosaves through several slots
    # "transition-autosaves",  # qol: autosave before doors, teleports and travel
    # "console",               # qol: in-game console (already in standard)
    # "diagnostics",           # instrumentation: crash records and a hang watchdog
]

# Patches the preset includes that you don't want, such as "console".
disable = []

# Add every patch in these categories: core, correctness, compat, performance, qol, balance,
# instrumentation.
# categories = []

[preferences]
# Applied after the Xbox's stored controls load. Omit the table to leave player preferences alone.
invert_look = false

[package]
# How mod files are shipped:
#   "delta-bsa":  mod files in their own archive beside the retail one. Needs LLVM.
#   "merged-bsa": mod files merged into a rebuilt Morrowind.bsa.
#   "loose":      every mod file loose in Data Files. No LLVM or archive needed and easy to
#                 inspect, but the Xbox searches large folders for every file.
mode = "delta-bsa"
# archive_name = "tes3xmods.bsa"     # the mod archive's name in delta-bsa mode
# archive_only = false               # read assets only from archives, never loose files
# loose_assets = []                  # patterns kept loose in an archive build, e.g. "textures/sky/*"
# drive_letter = "D"                 # drive the game reads its files from

# [plugins]
# order = ["Mod.esm", "Mod.esp"]     # load order; default: masters first, then mod order

[ini]
# "General:Show FPS" = 1
# "Xbox:AutosaveSlots" = 5           # docs/ini-keys.md lists the keys patches read

# Remove every [[mods]] block and profile.library for a patches-only build.
[[mods]]
id = "example-mod"                  # stable id from library.toml
version = "1.0"
components = ["extra-textures"]     # optional installer layers
order = 10                           # higher order wins file conflicts
# enabled = false
# optional = true                    # skip the mod if its folder is missing
# plugins = ["Example Mod.esp"]      # include only these plugins from this mod
# loose = true                       # ship this mod's files loose in an archive build
