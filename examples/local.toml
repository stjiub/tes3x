# Paths on this PC and the machines that run builds. Copy to tes3x.local.toml in the folder you run
# the commands from; profiles stay free of machine-specific paths.
default_target = "xbox"

[paths]
# Your own clean, unmodified copy of the game folder: it holds Default.xbe, morrowind.xbe,
# Morrowind.ini and Data Files.
vanilla_root = "C:/path/to/clean-retail-game"
# Where finished builds go. Each profile gets its own folder inside.
build_root = "build/pipeline"
# Folder holding clang and lld-link, for engine fixes and delta-bsa packing. Only needed when
# LLVM is not on PATH.
# llvm = "C:/Program Files/LLVM/bin"
# Hardlink unchanged retail files into builds instead of copying them. Needs the build folder
# and the retail folder on the same NTFS drive; otherwise files are copied.
# hardlink_retail = true
# mlox's rules file, for profiles that set rules.plugin_order = "mlox". Download mlox_base.txt
# from https://github.com/DanaePlays/mlox-rules and install mlox with: python -m pip install mlox
# mlox_rules = "C:/Tools/mlox/mlox_base.txt"
# Ghidra 11.3 or later with the ghidra-xbe loader, for tools/tes3x_sym.py decompile and refs.
# ghidra = "C:/Tools/ghidra_11.3_PUBLIC"

[targets.xbox]
kind = "xbox"
host = "192.168.1.20"              # the Xbox's IP address, shown by its dashboard
# Profile install_dir folders go below this. A deploy makes that folder match the build, so never
# use the folder name of an install you want to keep.
games_root = "F:/Games"
# Shared clean retail data for profiles with install_layout = "overlay". The GUI or
# --install-retail-base installs it explicitly and overlay deploys verify it first.
# retail_root = "F:/Games/MorrowindRetail"
# FTP login. The default is xbox/xbox. Instead of a password here, you can set the
# TES3X_FTP_PASSWORD environment variable or pass --ask-password.
# user = "xbox"
# password = "xbox"

[targets.xemu]
kind = "xemu"
ram = 64
# A folder can supply the files left unset below.
folder = "C:/xemu"
# exe = "C:/xemu/xemu.exe"
# bootrom = "C:/xemu/mcpx_1.0.bin"
# bios = "C:/xemu/bios.bin"
# bios_128mb = "C:/xemu/bios-128mb.bin"   # optional, for a 128 MB target
# eeprom = "C:/xemu/eeprom.bin"
# hdd = "C:/xemu/xbox_hdd.qcow2"
# extract_xiso = "C:/tools/extract-xiso.exe"
# gdb = "C:/tools/gdb.exe"
# template = "tools/xemu-template.toml"

# A second target can select another xemu version, BIOS and disk as well as another memory size.
# [targets.xemu-128]
# kind = "xemu"
# ram = 128
# folder = "C:/xemu-128"
