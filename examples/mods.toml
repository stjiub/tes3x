# Build the game with a list of mods, and optionally engine fixes.
#
# Copy this file, change the name and library, and list your mods.

[profile]
name = "my-mods"                   # also the output folder name: build/pipeline/my-mods
# title = "Morrowind Modded"       # optional: the name the Xbox dashboard shows
# remote_root = "F:/Games/MorrowindModded"  # optional: this build's own folder on the Xbox
library = "C:/path/to/mod-library" # a folder holding one folder per mod

[rules]
max_texture_size = 512             # larger textures are shrunk; the Xbox has 64 MB of RAM
clear_cache_partitions = true      # empty the Xbox's X/Y/Z cache on deploy, so new files are seen

[patches]
# minimal     - no engine fixes; only the patches every build needs
# standard    - the engine fixes that have been tested and are safe to leave on
# development - standard plus crash logging and the in-game console
preset = "standard"
enable = []                        # individual patches to add; see tools/tes3x_patch.py --list
disable = []

[package]
# delta-bsa  - mod assets go in their own archive next to Morrowind.bsa. Smaller rebuilds and
#              uploads, but needs the C compiler set up (see README).
# merged-bsa - mod assets are merged into a rebuilt Morrowind.bsa. No compiler needed.
mode = "delta-bsa"

# One [[mods]] block per mod. `name` is the mod's folder inside the library.
# When two mods contain the same file, the one with the higher `order` wins.
[[mods]]
name = "Example Mod"
order = 10

[[mods]]
name = "Another Mod"
order = 20
# enabled = false                  # keep the entry but leave the mod out
# optional = true                  # skip it quietly if its folder is missing
# plugins = ["Another Mod.esp"]    # ship only these plugins from the folder
