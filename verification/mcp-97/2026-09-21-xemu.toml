patch = "mcp-97"
date = 2026-09-21
environment = "xemu"
platform = "xemu 0.8.136"
result = "pass"
claim = "While initializing saved script data, every fixed-width operand skip advances 2 bytes instead of 3 and every length-prefixed skip advances N+1 instead of N, with the same tokens scanned."
method = "Both builds load the same 34-master save. A probe splices into the bytecode scan loop's shared landing site, which mcp-97 does not touch, and logs every cursor advance larger than one byte. The two runs' skips are paired in order."
not_established = "A save whose scan desynchronises without the fix; in this save vanilla resynchronised after every error. Hardware behaviour. The raw logs and build hashes were not retained; the observed values are copied from the findings log."
converted_from = "findings 2026-09-21: MCP-97 control-versus-patched confirmed"

[[run]]
role = "control"
observed = [
    "32 skips: fixed width 3 x24; length prefixed 7 x2, 13 x2, 14, 15 x3",
]

[[run]]
role = "patched"
observed = [
    "32 skips: fixed width 2 x24; length prefixed 8 x2, 14 x2, 15, 16 x3",
    "token index behind every skip identical to the control",
]
