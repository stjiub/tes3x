[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tes3x"
description = "Modding and patching toolkit for the original Xbox Morrowind"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "cryptography>=43,<47",
    "Pillow>=10,<13",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7", "tomlkit>=0.13,<1"]
dev = ["ruff"]

[project.scripts]
tes3x = "tes3x.cli:main"

[project.gui-scripts]
tes3x-gui = "tes3x.gui:main"

[project.urls]
Homepage = "https://github.com/stjiub/tes3x"

[tool.ruff]
extend-exclude = ["addons", "src/tes3x/_vendor"]

[tool.ruff.lint]
select = ["F"]  # pyflakes' rules

[tool.setuptools.dynamic]
version = { attr = "tes3x.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
