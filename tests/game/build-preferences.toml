kind = "single"
purpose = "A profile-selected normal-look preference is applied after stored controls load, swapping the right-stick vertical bindings before a clean menu exit."
procedure = "Boot a direct-engine build from an invert_look=false profile and inspect the binding-table log."
limitations = "Custom non-stick bindings, persistence after the game writes options, or original-Xbox behavior."
watch = 'diag\.patches|prefs\.|exec\.exit'
timeout = 180
script = '''
@menu wait 60
@menu exit
'''

[profile]
preferences = { invert_look = false }

[expect]
test = ['prefs\.invert_look 0', 'prefs\.look_up 26', 'prefs\.look_down 25', 'exec\.exit 0']
