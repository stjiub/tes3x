kind = "single"
purpose = "D-pad down and A on a targeted container take the highlighted stack; activating a container with a pending quick-loot request takes its item through the engine's own transfer routine, closes the menu, leaves menu mode off and still records theft from an owned container."
procedure = "Start a new game, take salt rice from an unowned sack in the Seyda Neen lighthouse and check menu mode over several seconds, then take moon sugar from a guard-owned crate in the warehouse and check the crime level."
limitations = "Covers single and multi-stack, empty and locked containers, and the D-pad and A input path with the real tooltip target, in xemu (the container is moved to eye level because the camera cannot be aimed). Traps, scripts, corpses, the Black/White modifier and the preview's appearance are not exercised."
watch = 'quickloot\.|menu\.MenuContents|exec[.>]|assert[.>]|crash\.|hang\.detected|fatal\.'
enable = ["diagnostics", "console", "extended-tooltips", "xbox-quick-loot"]
timeout = 180
xemu = ["--skip-intro", "--no-reboot"]
script = '''
@start new
wait 30
EnableInventoryMenu
coc "Seyda Neen, Lighthouse"
wait 60
assert player->GetItemCount "ingred_saltrice_01" == 0.00
"com_sack_01_saltrice_10"->AddItem "ingred_bread_01" 3
"com_sack_01_saltrice_10"->AddItem "ingred_scrib_jerky_01" 2
"com_sack_01_saltrice_10"->SetPos x -64
"com_sack_01_saltrice_10"->SetPos y -100
"com_sack_01_saltrice_10"->SetPos z -650
wait 90
tes3xql key down
wait 10
wait 5
tes3xql key a
activate com_sack_01_saltrice_10
wait 30
assert player->GetItemCount "ingred_bread_01" == 3.00
tes3xql mode
tes3xql take 0
activate com_sack_01_saltrice_10
wait 30
assert player->GetItemCount "ingred_saltrice_01" == 10.00
tes3xql take 0
activate com_sack_01_saltrice_10
wait 30
tes3xql take 0
activate com_sack_01_saltrice_10
wait 30
tes3xql mode
"com_sack_01_saltrice_10"->Lock 50
tes3xql take 0
activate com_sack_01_saltrice_10
wait 30
assert player->GetItemCount "ingred_scrib_jerky_01" == 0.00
tes3xql mode
coc "Seyda Neen, Census and Excise Warehouse"
wait 60
tes3xql mode
assert player->GetItemCount "ingred_moon_sugar_01" == 0.00
assert player->GetPCCrimeLevel == 0.00
tes3xql take 0
activate crate_02_moonsugar
wait 30
assert player->GetItemCount "ingred_moon_sugar_01" == 6.00
assert player->GetPCCrimeLevel == 300.00
visible MenuContents
tes3xql mode
exit
'''

[expect]
test = ['quickloot\.count 10', 'quickloot\.count 6', 'menu\.MenuContents 0',
        '!quickloot\.mode 1', '!quickloot\.mode_after 1', 'exec\.exit 0', 'assert\.failed 0']
