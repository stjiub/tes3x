kind = "single"
purpose = "At 1280x720 the journal, a book and a scroll open without a crash, with their scale taken from the screen height."
procedure = "Load the level-7 Seyda Neen fixture on a 720p build (hd-video, which requires this patch), then open the journal, read a scroll and read a book, checking that each menu is on screen."
limitations = "Whether each menu fits the screen is a look at the picture: compare screenshots with and without the patch. At 640x480 the patch computes the retail scale, so it has nothing to show there."
enable = ["diagnostics", "console", "hd-video"]
xemu = ["--skip-intro", "--no-reboot", "--ram", "128", "--bios", "cerbios", "--video", "720p"]
save = "vanilla-seyda-neen.ess"
watch = 'video\.mode|menu\.Menu|exec\.exit|crash\.|hang\.detected|fatal\.'
timeout = 240
script = '''
@start load U:\TES3X\vanilla-seyda-neen.ess
wait 600
menu journal
wait 300
visible MenuJournal
pad MenuJournal B
wait 120
player->additem bk_a1_1_directionscaiuscosades 1
player->equip bk_a1_1_directionscaiuscosades
wait 300
visible MenuScroll
pad MenuScroll B
wait 120
menu inventory
wait 120
player->additem bk_BriefHistoryEmpire1 1
player->equip bk_BriefHistoryEmpire1
wait 300
visible MenuBook
pad MenuBook B
wait 120
exit
'''

[expect]
test = ['menu\.MenuJournal 1', 'menu\.MenuScroll 1', 'menu\.MenuBook 1', 'exec\.exit 0']
