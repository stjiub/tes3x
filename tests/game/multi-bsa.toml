kind = "single"
purpose = "An archive packed from a mod is loaded alongside Morrowind.bsa, and the game still runs."
procedure = "Build a generated test mod holding one texture as a delta archive, start a new game, move to Balmora and assert the player arrived."
limitations = "Shows the extra archive is opened and chained; it does not read the texture back from it."
timeout = 180
script = '''
@start new
wait 30
assert player->getpos x == 61.00
coc "Balmora"
wait 60
assert player->getpos x == -12288.00
exit
'''

[fixture]
texture = true

[expect]
test = ['arch\.extra 1', 'exec\.exit']
