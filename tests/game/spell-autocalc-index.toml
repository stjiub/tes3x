kind = "single"
purpose = "Spells handed to NPC spell auto-calculation from the table are the ones the table was built from."
procedure = "Set AutoCalcIndex to verify, which checks every table record against its spell as the walk passes it and logs any difference, start a new game, then travel by name to an interior."
limitations = "Hardware timing. The Tamriel Rebuilt masters are checked the same way outside this test, and the NPCs' resulting spells are compared with the patch off in a private run."
watch = 'acalc\.|diag\.patches|exec\.exit|crash\.|hang\.detected|fatal\.'
enable = ["diagnostics", "console", "spell-autocalc-index"]
timeout = 240
script = '''
@start new
wait 30
coc "Seyda Neen, Census and Excise Office"
wait 30
exit
'''

[profile]
ini = { "Xbox:AutoCalcIndex" = "verify" }

[expect]
test = ['acalc\.mode 2', 'acalc\.cached [1-9]', 'acalc\.checks [1-9]', '!acalc\.mismatch', 'exec\.exit 0']
