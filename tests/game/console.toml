kind = "single"
purpose = "The build runs commands in tes3xexec.txt through the console's own compiler and logs their output; after coc the player's position is Balmora's."
procedure = "Start a New Game from the engine's main menu, run player->getpos x, coc \"Balmora\", player->getpos x and exit from E:\\tes3xexec.txt."
limitations = "Opening the console with the pad combination and typing on the on-screen keyboard; hardware behaviour."
watch = 'exec[.>]|console< GetPos|console\.more|diag\.enabled'
timeout = 120
script = '''
@menu click MenuOptions MenuOptions_New_container
wait 30
player->getpos x
coc "Balmora"
wait 60
player->getpos x
exit
'''

[expect]
test = ['exec\.loaded ', 'console< GetPos >> 61\.00', 'console< GetPos >> -12288\.00', 'exec\.exit']
