kind = "comparison"
purpose = "An actor in a cell with an empty pathgrid does not crash Wander or Flee."
procedure = "Link the patch on both sampled engines and reach a New Game session. A cell with a node-less pathgrid and a wandering or fleeing actor is the full reproducer."
limitations = "The command script proves the patched build reaches play. No fixture with a zero-node pathgrid exists yet."
watch = 'diag\.patches|exec\.exit|crash\.|hang\.detected|fatal\.'
timeout = 180
script = '''
@start new
wait 60
exit
'''

[expect]
control = ['exec\.exit 0']
test = ['diag\.patches', 'exec\.exit 0']
