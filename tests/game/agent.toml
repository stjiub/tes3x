kind = "single"
purpose = "The game pairs with a listener holding the pinned key, runs a console line the listener sends, returns a file it asks for, and shuts down on its request."
procedure = "Boot the engine directly with a tunnel and a throwaway listener key, start a new game, then from the listener run player->getpos x, fetch E:\\tes3xlog.txt and send exit."
limitations = "xemu reaches the listener through the tunnel's forwarded port, not a LAN; the scenario does not exercise a stall, a reconnection after the listener restarts, or hardware."
watch = 'mem\.agent|exec[.>]|assert[.>]|agent\.|live[.>]|console< GetPos|diag\.|crash\.|hang\.|fatal\.'
timeout = 240
script = '''
@start new
wait 30
assert player->getpos x == 61.00
mark agent-ready
wait 9000
'''

[agent]
after = 'mem\.agent-ready '
console = ["player->getpos x"]
fetch = ['E:\tes3xlog.txt']
exit = true

[expect]
test = ['agent\.connected ', 'live> player->getpos x', 'agent\.file ', 'live\.exit']

[sequence]
test = ['mem\.agent-ready ', 'live> player->getpos x', 'console< GetPos >> 61\.00', 'agent\.file ', 'live\.exit']
