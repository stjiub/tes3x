kind = "single"
purpose = "Cells found by name and by grid from the index are the cells the engine's own walks find."
procedure = "Set CellIndex to verify, which runs the engine's walk beside every indexed lookup and logs any difference, start a new game, then travel by name to an interior and to Balmora and by grid to an exterior."
limitations = "Hardware timing. Retail has a few thousand cells; the Tamriel Rebuilt masters are checked the same way outside this test."
watch = 'cellindex\.|diag\.patches|exec\.exit|crash\.|hang\.detected|fatal\.'
enable = ["diagnostics", "console", "cell-index"]
timeout = 240
script = '''
@start new
wait 30
coc "Seyda Neen, Census and Excise Office"
wait 30
coc "Balmora"
wait 60
assert player->getpos x == -12288.00
coe 2 -2
wait 60
exit
'''

[profile]
ini = { "Xbox:CellIndex" = "verify" }

[expect]
test = ['cellindex\.mode 2', 'cellindex\.checks [1-9]', '!cellindex\.mismatch', 'exec\.exit 0']
