kind = "single"
purpose = "A build carrying the de-nocker hook reaches a playable session without a crash."
procedure = "Boot a direct-engine build with mcp-146, start a new game, wait in game, then exit through the command script. Separately test the controller behavior described in the patch notes on hardware."
limitations = "The script cannot hold Attack or press Ready Weapon, so cancellation, ammunition count, bow state, and crossbow behavior require manual controller testing."
watch = 'diag\.patches|exec\.exit|crash\.|hang\.detected|fatal\.'
timeout = 180
script = '''
@start new
wait 60
exit
'''

[expect]
test = ['diag\.patches', 'exec\.exit 0']
